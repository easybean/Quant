[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-data-pipeline"
version = "0.1.0"
description = "Resumable US equity daily-bar ingestion for personal quantitative research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "pyarrow>=14,<21",
  "requests>=2.31,<3",
  "ta>=0.11,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "yfinance>=1.7.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
ui = [
  "streamlit>=1.38,<2",
  "plotly>=5.24,<7",
  "backtrader==1.9.78.123",
]

[project.scripts]
quant-data = "quant_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
